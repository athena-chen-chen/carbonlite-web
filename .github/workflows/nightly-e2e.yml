name: Nightly E2E

on:
  schedule:
    - cron: '30 2 * * *'
      timezone: America/Edmonton
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend-validation:
    name: Frontend tests, typecheck, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: carbonlite-web

    steps:
      - name: Check out web repository
        uses: actions/checkout@v4
        with:
          ref: release/v0.1-pilot
          path: carbonlite-web

      - name: Check out API repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/carbonlite-api
          path: carbonlite-api

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            carbonlite-web/pnpm-lock.yaml
            carbonlite-api/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install API dependencies
        working-directory: carbonlite-api
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: carbonlite-api
        run: pnpm exec prisma generate

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Keep routine full validation here; local development should prefer focused tests.
      - name: Run deterministic regression suite
        run: pnpm test --maxWorkers=2

      - name: Run critical browser regressions
        run: pnpm test:regression

      - name: Typecheck
        run: pnpm typecheck

      - name: Build production bundle
        run: pnpm build
