name: CarbonLite Regression Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  regression:
    name: Unit, build, and critical workflow smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: carbonlite-web

    steps:
      - name: Check out web repository
        uses: actions/checkout@v4
        with:
          path: carbonlite-web

      - name: Check out API repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/carbonlite-api
          path: carbonlite-api

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            carbonlite-web/pnpm-lock.yaml
            carbonlite-api/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install API dependencies
        working-directory: carbonlite-api
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: carbonlite-api
        run: pnpm exec prisma generate

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run deployment verification
        run: pnpm verify:deployment

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carbonlite-playwright-report
          path: carbonlite-web/apps/web-e2e/playwright-report
          retention-days: 7

      - name: Upload Playwright failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carbonlite-playwright-test-results
          path: carbonlite-web/apps/web-e2e/test-results
          retention-days: 7
