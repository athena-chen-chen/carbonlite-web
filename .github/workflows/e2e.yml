name: CarbonLite E2E

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  real-api-smoke:
    name: Playwright real API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carbonlite_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d carbonlite_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ALLOW_TEST_DB_RESET: 'true'
      CARBONLITE_API_DIR: ../carbonlite-api
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carbonlite_e2e
      E2E_API_BASE_URL: http://127.0.0.1:3333/api
      E2E_REAL_API: 'true'
      FRONTEND_URL: http://127.0.0.1:4173
      JWT_SECRET: carbonlite-e2e-jwt-secret
      NODE_ENV: test

    steps:
      - name: Check out web repository
        uses: actions/checkout@v4
        with:
          path: carbonlite-web

      - name: Check out API repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/carbonlite-api
          path: carbonlite-api

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            carbonlite-web/pnpm-lock.yaml
            carbonlite-api/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: carbonlite-web
        run: pnpm install --frozen-lockfile

      - name: Install API dependencies
        working-directory: carbonlite-api
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: carbonlite-web
        run: pnpm exec playwright install --with-deps chromium

      - name: Migrate E2E database
        working-directory: carbonlite-web
        run: pnpm e2e:migrate

      - name: Reset E2E database
        working-directory: carbonlite-web
        run: pnpm e2e:reset

      - name: Seed E2E database
        working-directory: carbonlite-web
        run: pnpm e2e:seed

      - name: Run Playwright real API smoke
        working-directory: carbonlite-web
        run: pnpm test:e2e:real

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carbonlite-e2e-playwright-report
          path: carbonlite-web/apps/web-e2e/playwright-report
          retention-days: 7

      - name: Upload Playwright failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carbonlite-e2e-test-results
          path: carbonlite-web/apps/web-e2e/test-results
          retention-days: 7
